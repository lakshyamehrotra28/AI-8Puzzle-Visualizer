<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141a2e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a233a"/>
      <stop offset="100%" stop-color="#101726"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="796" height="446" rx="14" fill="none" stroke="#25324e" stroke-width="1.5"/>

  <!-- Title -->
  <text x="400" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">8-Puzzle State Space Representation</text>
  <text x="400" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b9bb4" text-anchor="middle">Total Permutations: 9! = 362,880 | Reachable Solvable Space: 181,440 States (50%)</text>

  <!-- Connectors -->
  <path d="M 400 170 L 250 250" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="4,4" opacity="0.7"/>
  <path d="M 400 170 L 400 250" stroke="#10b981" stroke-width="2.5"/>
  <path d="M 400 170 L 550 250" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="4,4" opacity="0.7"/>
  <path d="M 400 310 L 400 365" stroke="#10b981" stroke-width="2.5"/>

  <!-- Root Node -->
  <g transform="translate(340, 105)">
    <rect width="120" height="70" rx="10" fill="url(#cardGrad)" stroke="#4f8ef7" stroke-width="2" filter="url(#glow)"/>
    <text x="60" y="26" font-family="monospace" font-size="12" font-weight="bold" fill="#4f8ef7" text-anchor="middle">Initial State</text>
    <text x="60" y="46" font-family="monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">[1,2,3,4,0,5,7,8,6]</text>
    <text x="60" y="62" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">h(n) = 2, f(n) = 2</text>
  </g>

  <!-- Successor Left -->
  <g transform="translate(190, 250)">
    <rect width="120" height="60" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="60" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Move LEFT</text>
    <text x="60" y="42" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">[1,2,3,0,4,5,7,8,6]</text>
    <text x="60" y="54" font-family="sans-serif" font-size="9" fill="#f87171" text-anchor="middle">h(n) = 3 (Pruned)</text>
  </g>

  <!-- Successor Center (Greedy Best) -->
  <g transform="translate(340, 250)">
    <rect width="120" height="60" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2.5"/>
    <text x="60" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">Move DOWN (Best)</text>
    <text x="60" y="42" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">[1,2,3,4,8,5,7,0,6]</text>
    <text x="60" y="54" font-family="sans-serif" font-size="9" fill="#34d399" text-anchor="middle">h(n) = 1 (Expanded)</text>
  </g>

  <!-- Successor Right -->
  <g transform="translate(490, 250)">
    <rect width="120" height="60" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="60" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Move RIGHT</text>
    <text x="60" y="42" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">[1,2,3,4,5,0,7,8,6]</text>
    <text x="60" y="54" font-family="sans-serif" font-size="9" fill="#f87171" text-anchor="middle">h(n) = 2 (Deferred)</text>
  </g>

  <!-- Goal Node -->
  <g transform="translate(340, 365)">
    <rect width="120" height="60" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
    <text x="60" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Goal Reached 🎯</text>
    <text x="60" y="42" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">[1,2,3,4,5,6,7,8,0]</text>
    <text x="60" y="54" font-family="sans-serif" font-size="9" fill="#38bdf8" text-anchor="middle">h(n) = 0, Cost = 3</text>
  </g>

  <!-- Legend Box -->
  <g transform="translate(40, 360)">
    <rect width="220" height="65" rx="8" fill="#131c30" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="22" r="5" fill="#10b981"/>
    <text x="35" y="26" font-family="sans-serif" font-size="10" fill="#e2e8f0">Greedy Path: Lowest h(n)</text>
    <circle cx="20" cy="44" r="5" fill="#f87171"/>
    <text x="35" y="48" font-family="sans-serif" font-size="10" fill="#94a3b8">Higher h(n): Retained in Frontier</text>
  </g>
</svg>
