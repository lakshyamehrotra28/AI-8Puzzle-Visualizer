<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141a2e"/>
    </linearGradient>
    <linearGradient id="evenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="oddGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="796" height="446" rx="14" fill="none" stroke="#25324e" stroke-width="1.5"/>

  <!-- Title -->
  <text x="400" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">8-Puzzle Solvability & Inversion Parity Partition</text>
  <text x="400" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b9bb4" text-anchor="middle">Theorem: Any legal tile move maintains inversion parity (mod 2) strictly invariant.</text>

  <!-- Left: Solvable Subspace (Even Parity) -->
  <g transform="translate(60, 110)">
    <rect width="320" height="240" rx="12" fill="url(#evenGrad)" stroke="#10b981" stroke-width="2" opacity="0.85"/>
    <text x="160" y="36" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Solvable Equivalence Class</text>
    <text x="160" y="60" font-family="sans-serif" font-size="13" fill="#a7f3d0" text-anchor="middle">181,440 Reachable States (50%)</text>
    <line x1="20" y1="75" x2="300" y2="75" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>

    <text x="30" y="105" font-family="sans-serif" font-size="12" fill="#ffffff">• Inversion Count: Even (inv % 2 == 0)</text>
    <text x="30" y="130" font-family="sans-serif" font-size="12" fill="#ffffff">• Standard Goal: [1,2,3,4,5,6,7,8,0]</text>
    <text x="30" y="155" font-family="sans-serif" font-size="12" fill="#ffffff">• Inversions of Standard Goal: 0 (Even)</text>
    <text x="30" y="180" font-family="sans-serif" font-size="12" fill="#ffffff">• Reachable via legal sliding actions</text>

    <rect x="25" y="195" width="270" height="30" rx="6" fill="#064e3b"/>
    <text x="160" y="215" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">SOLVABLE FROM STANDARD GOAL ✓</text>
  </g>

  <!-- Right: Unsolvable Subspace (Odd Parity) -->
  <g transform="translate(420, 110)">
    <rect width="320" height="240" rx="12" fill="url(#oddGrad)" stroke="#ef4444" stroke-width="2" opacity="0.85"/>
    <text x="160" y="36" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Unsolvable Equivalence Class</text>
    <text x="160" y="60" font-family="sans-serif" font-size="13" fill="#fca5a5" text-anchor="middle">181,440 Unreachable States (50%)</text>
    <line x1="20" y1="75" x2="300" y2="75" stroke="#ef4444" stroke-width="1.5" opacity="0.5"/>

    <text x="30" y="105" font-family="sans-serif" font-size="12" fill="#ffffff">• Inversion Count: Odd (inv % 2 == 1)</text>
    <text x="30" y="130" font-family="sans-serif" font-size="12" fill="#ffffff">• Example: Swapping 7 and 8</text>
    <text x="30" y="155" font-family="sans-serif" font-size="12" fill="#ffffff">• Disconnected component of graph</text>
    <text x="30" y="180" font-family="sans-serif" font-size="12" fill="#ffffff">• Zero legal transition paths exist</text>

    <rect x="25" y="195" width="270" height="30" rx="6" fill="#450a0a"/>
    <text x="160" y="215" font-family="monospace" font-size="11" font-weight="bold" fill="#f87171" text-anchor="middle">STRICTLY IMPOSSIBLE TO SOLVE ✗</text>
  </g>

  <!-- Bottom Transition Rule Note -->
  <g transform="translate(60, 368)">
    <rect width="680" height="58" rx="8" fill="#131c30" stroke="#334155" stroke-width="1"/>
    <text x="340" y="24" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">Parity Invariance Rule:</text>
    <text x="340" y="44" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Horizontal slide changes 0 inversions. Vertical slide swaps blank with tile 3 spots away, changing inversions by ±2 or 0. Thus parity is invariant!</text>
  </g>
</svg>
